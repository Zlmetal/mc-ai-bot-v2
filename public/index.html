<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>MC AI Bot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; display: flex; flex-direction: column; }

    /* 状态栏 */
    .status-bar { padding: 10px 14px; background: #1a1a2e; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 8px; flex-shrink: 0; min-height: 44px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #f44336; flex-shrink: 0; }
    .status-dot.online { background: #4caf50; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .status-info { flex: 1; min-width: 0; }
    .status-name { font-weight: 600; font-size: 14px; }
    .status-detail { font-size: 11px; color: #888; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .settings-link { color: #888; text-decoration: none; font-size: 18px; padding: 4px; }

    /* 聊天区域 */
    .chat-area { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch; }
    .msg { max-width: 88%; padding: 9px 12px; border-radius: 14px; font-size: 14px; line-height: 1.45; word-break: break-word; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .msg.user { align-self: flex-end; background: #2563eb; color: white; border-bottom-right-radius: 4px; }
    .msg.ai { align-self: flex-start; background: #1e1e2e; border: 1px solid #333; border-bottom-left-radius: 4px; }
    .msg.system { align-self: center; background: none; color: #666; font-size: 11px; }
    .msg.ai.speaking { border-color: #4caf50; box-shadow: 0 0 10px rgba(76, 175, 80, 0.2); }
    .typing-indicator { display: none; align-self: flex-start; padding: 9px 12px; background: #1e1e2e; border: 1px solid #333; border-radius: 14px; border-bottom-left-radius: 4px; }
    .typing-indicator.active { display: flex; gap: 4px; }
    .typing-dot { width: 5px; height: 5px; background: #666; border-radius: 50%; animation: typingBounce 1.4s infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }

    /* 底部输入区 */
    .input-area {
      padding: 8px 10px;
      padding-bottom: max(8px, env(safe-area-inset-bottom));
      background: #1a1a2e;
      border-top: 1px solid #333;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    /* 模式切换 */
    .mode-switch { display: flex; gap: 6px; }
    .mode-btn {
      flex: 1; padding: 6px 0; border: 1px solid #333; border-radius: 6px;
      background: #1e1e2e; color: #888; font-size: 12px; cursor: pointer;
      transition: all 0.2s; text-align: center;
    }
    .mode-btn.active { background: #2563eb; color: white; border-color: #2563eb; }

    /* 玩家 ID 选择 */
    .player-bar {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 0; margin-bottom: 4px;
    }
    .player-label { font-size: 13px; color: #888; }
    .player-select {
      flex: 1; padding: 4px 8px; background: #1e1e2e; border: 1px solid #333;
      border-radius: 6px; color: #e0e0e0; font-size: 12px; outline: none;
    }
    .player-select:focus { border-color: #2563eb; }
    .player-input {
      flex: 1; padding: 4px 8px; background: #1e1e2e; border: 1px solid #333;
      border-radius: 6px; color: #e0e0e0; font-size: 12px; outline: none;
    }
    .player-input:focus { border-color: #2563eb; }
    .player-btn {
      padding: 4px 10px; background: #2563eb; border: none; border-radius: 6px;
      color: white; font-size: 12px; cursor: pointer;
    }

    /* 文字输入行 */
    .text-row { display: flex; gap: 8px; align-items: flex-end; }
    .text-input {
      flex: 1; background: #0d0d1a; border: 1px solid #333; border-radius: 18px;
      padding: 9px 14px; color: white; font-size: 14px; outline: none; resize: none;
      max-height: 80px; font-family: inherit; line-height: 1.3;
    }
    .text-input:focus { border-color: #2563eb; }
    .text-input::placeholder { color: #555; }
    .btn { width: 38px; height: 38px; border-radius: 50%; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 16px;
      transition: all 0.15s; flex-shrink: 0; }
    .btn-send { background: #2563eb; color: white; }
    .btn-send:active { transform: scale(0.9); }
    .btn-send:disabled { background: #333; color: #666; }

    /* 语音输入行 */
    .voice-row { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 6px 0; }
    .voice-btns { display: flex; gap: 12px; align-items: center; }
    .voice-btn {
      width: 56px; height: 56px; border-radius: 50%; border: 2px solid #444;
      background: #1e1e2e; color: #aaa; font-size: 22px; cursor: pointer;
      transition: all 0.15s; display: flex; align-items: center; justify-content: center;
    }
    .voice-btn:active { transform: scale(0.93); }
    .voice-btn.recording { background: #d32f2f; border-color: #f44336; color: white; animation: pulse-ring 1s infinite; }
    .voice-btn.in-call { background: #d32f2f; border-color: #f44336; color: white; animation: pulse-ring 1.5s infinite; }
    @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(244, 67, 54, 0.4); } 100% { box-shadow: 0 0 0 16px rgba(244, 67, 54, 0); } }
    .voice-hint { font-size: 12px; color: #666; text-align: center; }
    .voice-hint.active { color: #4caf50; }
    .voice-hint.recording { color: #f44336; }

    /* 唤醒词状态 */
    .wake-status {
      font-size: 11px; color: #4caf50; text-align: center;
      padding: 2px 8px; background: rgba(76,175,80,0.1); border-radius: 4px;
      display: none;
    }
    .wake-status.active { display: block; }
  </style>
</head>
<body>
  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <div class="status-info">
      <div class="status-name">MC AI Bot</div>
      <div class="status-detail" id="statusDetail">连接中...</div>
    </div>
    <div class="status-actions">
      <a href="/settings.html" class="settings-link">⚙️</a>
      <a href="#" class="settings-link" id="btnLogout" title="退出">🚪</a>
    </div>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="msg system">与 AI 玩家对话</div>
    <div class="typing-indicator" id="typingIndicator">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>
  </div>

  <div class="input-area">
    <!-- Bot 选择 -->
    <div class="player-bar" id="botBar">
      <span class="player-label">🤖</span>
      <select id="botSelect" class="player-select">
        <option value="">选择 Bot...</option>
      </select>
    </div>
    <!-- 玩家 ID 选择 -->
    <div class="player-bar" id="playerBar">
      <span class="player-label">🎮</span>
      <select id="playerSelect" class="player-select">
        <option value="">选择玩家...</option>
      </select>
      <input type="text" id="playerCustom" class="player-input" placeholder="输入自定义ID" style="display:none;">
      <button class="player-btn" id="playerConfirm" style="display:none;">✓</button>
    </div>

    <div class="mode-switch">
      <button class="mode-btn active" id="modeText">⌨️ 文字</button>
      <button class="mode-btn" id="modeVoice">🎤 语音</button>
    </div>
    <!-- 文字模式 -->
    <div class="text-row" id="textRow">
      <textarea class="text-input" id="textInput" placeholder="说点什么..." rows="1"></textarea>
      <button class="btn btn-send" id="btnSend" disabled>↑</button>
    </div>
    <!-- 语音模式 -->
    <div class="voice-row" id="voiceRow" style="display: none;">
      <div class="voice-btns">
        <button class="voice-btn" id="btnVoice" title="按住说话">🎤</button>
        <button class="voice-btn" id="btnPhone" title="实时通话">📞</button>
      </div>
      <div class="voice-hint" id="voiceHint">按住说话 · 📞实时通话</div>
      <div class="wake-status" id="wakeStatus">🟢 监听中</div>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id)
    const chatArea = $('chatArea')
    const typingIndicator = $('typingIndicator')

    // ========== 获取配置（唤醒词） ==========
    let wakeWord = '小智'
    let wakeEnabled = false
    fetch('/api/config').then(r => r.json()).then(c => {
      if (c.wake?.enabled) {
        wakeEnabled = true
        wakeWord = c.wake.word || c.bot?.name || '小智'
      } else {
        wakeEnabled = false
        wakeWord = c.bot?.name || '小智'
      }
      updateWakeStatus()
    }).catch(() => {})

    function updateWakeStatus() {
      const el = $('wakeStatus')
      if (wakeEnabled) {
        el.textContent = wakeEnabled ? `🟢 监听中，说「${wakeWord}」唤醒` : '🟢 监听中，直接说话即可'
        el.style.display = 'block'
      } else {
        el.textContent = '🟢 监听中，直接说话即可'
        el.style.display = 'block'
      }
    }

    // ========== 模式切换 ==========
    $('modeText').addEventListener('click', () => {
      $('modeText').classList.add('active')
      $('modeVoice').classList.remove('active')
      $('textRow').style.display = 'flex'
      $('voiceRow').style.display = 'none'
      stopCall()
    })
    $('modeVoice').addEventListener('click', () => {
      $('modeVoice').classList.add('active')
      $('modeText').classList.remove('active')
      $('textRow').style.display = 'none'
      $('voiceRow').style.display = 'flex'
    })

    // ========== WebSocket ==========
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:'
    let ws = null
    let audioQueue = []
    let isPlayingAudio = false
    let reconnectAttempts = 0

    function connect() {
      if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) return
      try { ws = new WebSocket(`${protocol}//${location.host}`) } catch (e) { scheduleReconnect(); return }
      ws.onopen = () => { reconnectAttempts = 0; $('statusDot').classList.add('online'); $('statusDetail').textContent = '已连接'; if (window._fetchPlayers) window._fetchPlayers() }
      ws.onclose = () => { $('statusDot').classList.remove('online'); $('statusDetail').textContent = '连接断开'; scheduleReconnect() }
      ws.onerror = () => {}
      ws.onmessage = (e) => {
        try {
          const d = JSON.parse(e.data)
          // 处理玩家列表
          if (d.type === 'players' && Array.isArray(d.players)) {
            const select = $('playerSelect')
            if (select) {
              const current = select.value
              while (select.options.length > 1) select.remove(0)
              d.players.forEach(p => {
                const opt = document.createElement('option')
                opt.value = p
                opt.textContent = p
                select.insertBefore(opt, select.options[select.options.length - 1])
              })
              if (current) select.value = current
            }
          }
          handleMessage(d)
        } catch (err) {}
      }
    }
    function scheduleReconnect() { reconnectAttempts++; setTimeout(connect, Math.min(3000 * reconnectAttempts, 30000)) }

    function handleMessage(data) {
      switch (data.type) {
        case 'status':
          if (data.data?.mindcraft_connected) {
            $('statusDot').classList.add('online')
            $('statusDetail').textContent = '已连接'
          }
          break
        case 'text': addMessage('ai', data.text); hideTyping(); break
        case 'bot-message': addMessage('ai', data.text); hideTyping(); autoTTS(data.text); break
        case 'audio': if (data.audioUrl) { audioQueue.push(data.audioUrl); playNextAudio() } break
        case 'stop_audio': audioQueue = []; document.querySelectorAll('.msg.ai.speaking').forEach(el => el.classList.remove('speaking')); break
      }
    }

    // ========== TTS ==========
    async function autoTTS(text) {
      try {
        const r = await fetch('/api/tts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) })
        const d = await r.json()
        if (d.success && d.audioUrl) { audioQueue.push(d.audioUrl); playNextAudio() }
      } catch (e) {}
    }
    async function playNextAudio() {
      if (isPlayingAudio || audioQueue.length === 0) return
      isPlayingAudio = true
      const url = audioQueue.shift()
      const msgs = chatArea.querySelectorAll('.msg.ai')
      const lastMsg = msgs[msgs.length - 1]
      if (lastMsg) lastMsg.classList.add('speaking')
      const audio = new Audio(url)
      audio.onended = () => { if (lastMsg) lastMsg.classList.remove('speaking'); isPlayingAudio = false; playNextAudio() }
      audio.onerror = () => { isPlayingAudio = false; playNextAudio() }
      try { await audio.play() } catch (e) { isPlayingAudio = false }
    }

    // ========== 聊天 ==========
    function addMessage(role, text) {
      const msg = document.createElement('div')
      msg.className = `msg ${role}`
      msg.textContent = text
      chatArea.insertBefore(msg, typingIndicator)
      chatArea.scrollTop = chatArea.scrollHeight
    }
    function showTyping() { typingIndicator.classList.add('active'); chatArea.scrollTop = chatArea.scrollHeight }
    function hideTyping() { typingIndicator.classList.remove('active') }
    function getPlayerName() {
      const select = $('playerSelect')
      const custom = $('playerCustom')
      if (select.value === '__custom__') {
        return custom.value.trim() || 'WEB'
      }
      return select.value || 'WEB'
    }

    function sendMessage(text) {
      if (!text || !ws || ws.readyState !== WebSocket.OPEN) return
      addMessage('user', text)
      const playerName = getPlayerName()
      const botId = $('botSelect')?.value || ''
      ws.send(JSON.stringify({ type: 'chat', text, playerName, botId }))
      showTyping()
    }

    // ========== 玩家 ID 选择 ==========
    (function initPlayerSelect() {
      const select = $('playerSelect')
      const custom = $('playerCustom')
      const confirm = $('playerConfirm')

      // 从 localStorage 恢复
      const saved = localStorage.getItem('mc-player-name') || ''

      // 添加自定义选项
      const opt = document.createElement('option')
      opt.value = '__custom__'
      opt.textContent = '✏️ 自定义ID...'
      select.appendChild(opt)

      // 恢复上次选择
      if (saved) {
        const exists = Array.from(select.options).some(o => o.value === saved)
        if (exists) {
          select.value = saved
        } else {
          select.value = '__custom__'
          custom.value = saved
          custom.style.display = ''
          confirm.style.display = ''
        }
      }

      select.addEventListener('change', () => {
        if (select.value === '__custom__') {
          custom.style.display = ''
          confirm.style.display = ''
          custom.focus()
        } else {
          custom.style.display = 'none'
          confirm.style.display = 'none'
          localStorage.setItem('mc-player-name', select.value)
        }
      })

      confirm.addEventListener('click', () => {
        const name = custom.value.trim()
        if (name) localStorage.setItem('mc-player-name', name)
      })

      custom.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const name = custom.value.trim()
          if (name) localStorage.setItem('mc-player-name', name)
        }
      })

      // 连接成功后获取在线玩家
      window._fetchPlayers = function() {
        if (!ws || ws.readyState !== WebSocket.OPEN) return
        ws.send(JSON.stringify({ type: 'get-players' }))
      }

      // 定期刷新
      setInterval(() => window._fetchPlayers(), 30000)
    })()

    // ========== Bot 选择 ==========
    ;(function initBotSelect() {
      const select = $('botSelect')
      if (!select) return
      // 从 localStorage 恢复
      const saved = localStorage.getItem('mc-active-bot') || ''

      async function loadBots() {
        try {
          const r = await fetch('/api/bots')
          const d = await r.json()
          if (d.success && d.bots) {
            const current = select.value || saved
            // 清除旧选项（保留第一个）
            while (select.options.length > 1) select.remove(0)
            d.bots.forEach(b => {
              if (b.enabled === false) return
              const opt = document.createElement('option')
              opt.value = b.id
              opt.textContent = b.name + (b.online ? ' 🟢' : '')
              select.insertBefore(opt, select.options[select.options.length - 1])
            })
            if (current) select.value = current
          }
        } catch (e) {}
      }

      select.addEventListener('change', () => {
        localStorage.setItem('mc-active-bot', select.value)
      })

      loadBots()
      setInterval(loadBots, 15000)
    })()

    $('textInput').addEventListener('input', () => {
      $('btnSend').disabled = !$('textInput').value.trim()
      $('textInput').style.height = 'auto'
      $('textInput').style.height = Math.min($('textInput').scrollHeight, 80) + 'px'
    })
    $('textInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault()
        const t = $('textInput').value.trim()
        if (t) { sendMessage(t); $('textInput').value = ''; $('textInput').style.height = 'auto'; $('btnSend').disabled = true }
      }
    })
    $('btnSend').addEventListener('click', () => {
      const t = $('textInput').value.trim()
      if (t) { sendMessage(t); $('textInput').value = ''; $('textInput').style.height = 'auto'; $('btnSend').disabled = true }
    })

    // ========== 语音（按住说话 + STT） ==========
    let mediaRecorder = null
    let audioChunks = []
    let isRecording = false

    async function initVoice() {
      if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
        // HTTP 环境，降级到 Web Speech API
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition
        if (SR) {
          const rec = new SR()
          rec.lang = 'zh-CN'; rec.continuous = false; rec.interimResults = false
          rec.onstart = () => { isRecording = true; $('btnVoice').classList.add('recording'); $('voiceHint').textContent = '正在听...' }
          rec.onresult = (e) => { const t = e.results[e.results.length - 1][0].transcript; if (t.trim()) sendMessage(t) }
          rec.onerror = () => stopRecording()
          rec.onend = () => stopRecording()
          $('btnVoice').addEventListener('mousedown', startRecording.bind(null, rec))
          $('btnVoice').addEventListener('mouseup', stopRecording.bind(null, rec))
          $('btnVoice').addEventListener('mouseleave', stopRecording.bind(null, rec))
          $('btnVoice').addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(rec) })
          $('btnVoice').addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(rec) })
          return
        }
      }
      // HTTPS 环境，用 MediaRecorder + Whisper
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true })
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' })
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data) }
        mediaRecorder.onstop = async () => {
          $('voiceHint').textContent = '识别中...'
          const blob = new Blob(audioChunks, { type: 'audio/webm' }); audioChunks = []
          if (blob.size < 1000) { $('voiceHint').textContent = '按住说话 · 📞实时通话'; return }
          try {
            const r = await fetch('/api/stt', { method: 'POST', headers: { 'Content-Type': 'audio/webm' }, body: blob })
            const d = await r.json()
            if (d.success && d.text) sendMessage(d.text)
          } catch (e) {}
          $('voiceHint').textContent = '按住说话 · 📞实时通话'
        }
      } catch (e) { $('voiceHint').textContent = '麦克风不可用' }
    }
    function startRecording(rec) {
      if (isRecording) return
      if (mediaRecorder) { isRecording = true; audioChunks = []; mediaRecorder.start(100) }
      else if (rec) { try { rec.start() } catch (e) {} }
      $('btnVoice').classList.add('recording')
      $('voiceHint').textContent = '正在录音...'
      $('voiceHint').classList.add('recording')
    }
    function stopRecording(rec) {
      if (!isRecording) return; isRecording = false
      if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop()
      else if (rec) { try { rec.stop() } catch (e) {} }
      $('btnVoice').classList.remove('recording')
      $('voiceHint').textContent = '按住说话 · 📞实时通话'
      $('voiceHint').classList.remove('recording')
    }
    $('btnVoice').addEventListener('mousedown', () => { if (isPlayingAudio) { audioQueue = []; isPlayingAudio = false } startRecording(null) })
    $('btnVoice').addEventListener('mouseup', () => stopRecording(null))
    $('btnVoice').addEventListener('mouseleave', () => stopRecording(null))
    $('btnVoice').addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(null) })
    $('btnVoice').addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(null) })

    // ========== 实时通话（带唤醒词） ==========
    let isInCall = false
    let callAudioContext = null
    let callAnalyser = null
    let callMediaRecorder = null
    let callChunks = []
    let callIsSpeaking = false
    let callSilenceTimer = null
    let callAnimFrame = null
    let callIsListening = false  // true = 正在听唤醒词后的内容
    const SILENCE_THRESHOLD = 0.015
    const SILENCE_DURATION = 1200
    const MIN_SPEECH_DURATION = 500
    let callSpeechStartTime = 0

    $('btnPhone').addEventListener('click', () => { isInCall ? stopCall() : startCall() })

    async function startCall() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true })
        callAudioContext = new AudioContext()
        const source = callAudioContext.createMediaStreamSource(stream)
        callAnalyser = callAudioContext.createAnalyser()
        callAnalyser.fftSize = 512
        source.connect(callAnalyser)
        callMediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' })
        callMediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) callChunks.push(e.data) }
        callMediaRecorder.onstop = async () => {
          const blob = new Blob(callChunks, { type: 'audio/webm' }); callChunks = []
          if (blob.size < 1000 || !isInCall) { if (isInCall) { callMediaRecorder.start(100) } return }
          $('voiceHint').textContent = '⏳ 识别中...'
          try {
            const r = await fetch('/api/stt', { method: 'POST', headers: { 'Content-Type': 'audio/webm' }, body: blob })
            const d = await r.json()
            if (d.success && d.text && isInCall) {
              if (!wakeEnabled) {
                // 唤醒词未启用，直接发送所有语音
                sendMessage(d.text)
              } else {
                // 唤醒词启用，需要检测唤醒词
                if (d.text.includes(wakeWord)) {
                  // 唤醒词命中，标记为已唤醒
                  callIsListening = true
                  const cleaned = d.text.replace(new RegExp(wakeWord, 'g'), '').trim()
                  if (cleaned) {
                    sendMessage(cleaned)
                    callIsListening = false  // 说完回到监听状态
                  } else {
                    addMessage('system', '🔔 已唤醒，请说话...')
                  }
                } else if (callIsListening) {
                  // 已唤醒状态，直接发送
                  sendMessage(d.text)
                  callIsListening = false  // 说完回到监听状态
                }
              }
            }
          } catch (e) {}
          if (isInCall) {
            $('voiceHint').textContent = wakeEnabled ? `🟢 监听中，说「${wakeWord}」唤醒` : '🟢 直接说话即可'
            callMediaRecorder.start(100)
          }
        }
        isInCall = true
        $('btnPhone').classList.add('in-call')
        $('btnPhone').textContent = '📵'
        
        if (wakeEnabled) {
          $('voiceHint').textContent = wakeEnabled ? `🟢 监听中，说「${wakeWord}」唤醒` : '🟢 直接说话即可'
          $('wakeStatus').textContent = wakeEnabled ? `🟢 监听中，说「${wakeWord}」唤醒` : '🟢 直接说话即可'
          addMessage('system', `📞 实时通话已开启，说「${wakeWord}」唤醒 AI`)
        } else {
          $('voiceHint').textContent = '🟢 直接说话即可'
          $('wakeStatus').textContent = '🟢 监听中，直接说话即可'
          addMessage('system', '📞 实时通话已开启，直接说话即可')
        }
        $('wakeStatus').classList.add('active')
        callMediaRecorder.start(100)
        startVAD()
      } catch (e) { addMessage('system', '麦克风权限获取失败') }
    }

    function stopCall() {
      isInCall = false; callIsListening = false
      $('btnPhone').classList.remove('in-call')
      $('btnPhone').textContent = '📞'
      $('voiceHint').textContent = '按住说话 · 📞实时通话'
      $('wakeStatus').classList.remove('active')
      addMessage('system', '📞 通话已结束')
      if (callMediaRecorder && callMediaRecorder.state === 'recording') callMediaRecorder.stop()
      if (callAnimFrame) cancelAnimationFrame(callAnimFrame)
      if (callAudioContext) callAudioContext.close()
      callAudioContext = null; callAnalyser = null; callIsSpeaking = false
      if (callSilenceTimer) clearTimeout(callSilenceTimer)
    }

    function startVAD() {
      const dataArray = new Uint8Array(callAnalyser.frequencyBinCount)
      function checkVolume() {
        if (!isInCall || !callAnalyser) return
        callAnalyser.getByteFrequencyData(dataArray)
        let sum = 0
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i]
        const avg = sum / dataArray.length / 255
        if (avg > SILENCE_THRESHOLD) {
          if (!callIsSpeaking) {
            callIsSpeaking = true
            callSpeechStartTime = Date.now()
            $('voiceHint').textContent = '🔴 正在听...'
            $('voiceHint').classList.add('recording')
          }
          if (callSilenceTimer) { clearTimeout(callSilenceTimer); callSilenceTimer = null }
        } else {
          if (callIsSpeaking && !callSilenceTimer) {
            callSilenceTimer = setTimeout(() => {
              const duration = Date.now() - callSpeechStartTime
              if (duration > MIN_SPEECH_DURATION && callMediaRecorder.state === 'recording') {
                callIsSpeaking = false
                $('voiceHint').textContent = '⏳ 识别中...'
                $('voiceHint').classList.remove('recording')
                callMediaRecorder.stop()
              } else {
                callIsSpeaking = false
                callSilenceTimer = null
              }
            }, SILENCE_DURATION)
          }
        }
        callAnimFrame = requestAnimationFrame(checkVolume)
      }
      checkVolume()
    }

    // ========== 退出登录 ==========
    $('btnLogout').addEventListener('click', async (e) => {
      e.preventDefault()
      await fetch('/api/logout', { method: 'POST' })
      window.location.href = '/login.html'
    })

    // ========== 启动 ==========
    initVoice()
    connect()
  </script>
</body>
</html>
