<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>高级设置 - MC AI Bot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; min-height: 100vh; padding-bottom: 80px; }
    .header { padding: 14px 16px; background: #1a1a2e; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; }
    .back-btn { color: #888; text-decoration: none; font-size: 18px; }
    .header h1 { font-size: 16px; font-weight: 600; }
    .container { max-width: 600px; margin: 0 auto; padding: 16px; }
    .section { background: #1e1e2e; border-radius: 10px; border: 1px solid #333; margin-bottom: 12px; overflow: hidden; }
    .section-title { font-weight: 600; font-size: 14px; color: #4caf50; padding: 12px 14px; border-bottom: 1px solid #333; background: rgba(76,175,80,0.05); }
    .field { padding: 10px 14px; border-bottom: 1px solid #252535; }
    .field:last-child { border-bottom: none; }
    .field label { display: block; font-size: 13px; color: #aaa; margin-bottom: 4px; font-weight: 500; }
    .field input, .field select { width: 100%; padding: 9px 12px; background: #0d0d1a; border: 1px solid #333; border-radius: 6px; color: white; font-size: 14px; outline: none; }
    .field input:focus, .field select:focus { border-color: #2563eb; }
    .field input[type="checkbox"] { width: auto; margin-right: 6px; }
    .checkbox-row { display: flex; align-items: center; gap: 6px; padding: 4px 0; }
    .help-text { font-size: 11px; color: #666; margin-top: 3px; line-height: 1.4; }
    .btn-save { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); padding: 12px 40px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; z-index: 10; box-shadow: 0 4px 12px rgba(37,99,235,0.4); }
    .btn-save:active { transform: translateX(-50%) scale(0.96); }
    .btn-save:disabled { background: #333; box-shadow: none; }
    .message { padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; }
    .message.success { background: rgba(76,175,80,0.15); color: #4caf50; }
    .message.error { background: rgba(244,67,54,0.15); color: #f44336; }
    .message.info { background: rgba(33,150,243,0.15); color: #2196f3; }
    .loading { text-align: center; padding: 40px; color: #666; }
    .field-json textarea { width: 100%; min-height: 60px; background: #0d0d1a; border: 1px solid #333; border-radius: 6px; color: white; font-size: 13px; font-family: 'Consolas', monospace; padding: 8px; outline: none; resize: vertical; }
    .field-json textarea:focus { border-color: #2563eb; }
  </style>
</head>
<body>
  <div class="header">
    <a href="/settings.html" class="back-btn">←</a>
    <h1>⚙️ 高级设置 (settings.js)</h1>
  </div>

  <div class="container" id="container">
    <div class="loading">加载中...</div>
  </div>

  <button class="btn-save" id="btnSave" disabled>保存并重启 MindCraft</button>

  <script>
    const $ = id => document.getElementById(id)

    // settings.js 字段定义：{ key, label, type, help, default, options? }
    const FIELDS = [
      // === MindServer 设置 ===
      { section: '🖥️ MindServer 设置' },
      { key: 'mindserver_port', label: 'MindServer 端口', type: 'number', default: 8080, help: 'MindCraft 管理服务的端口，通常不需要修改' },
      { key: 'auto_open_ui', label: '自动打开 UI', type: 'checkbox', default: true, help: '启动时是否自动在浏览器中打开 MindCraft 控制台' },

      // === 渲染设置 ===
      { section: '🎨 渲染设置' },
      { key: 'render_bot_view', label: '渲染 Bot 视角', type: 'checkbox', default: false, help: '在浏览器中显示 Bot 的第一人称视角（localhost:3000）' },

      // === 超时与调试 ===
      { section: '⏱️ 超时与调试' },
      { key: 'block_place_delay', label: '放置方块延迟（毫秒）', type: 'number', default: 0, help: '连续放置方块之间的延迟（毫秒），防止被服务器反作弊踢出' },
      { key: 'log_all_prompts', label: '记录所有提示词', type: 'checkbox', default: false, help: '是否将所有发送给模型的提示词记录到文件（调试用）' },
    ]

    let currentSettings = {}

    function showMessage(text, type) {
      const existing = document.querySelector('.message')
      if (existing) existing.remove()
      const msg = document.createElement('div')
      msg.className = `message ${type}`
      msg.textContent = text
      $('container').insertBefore(msg, $('container').firstChild)
      setTimeout(() => msg.remove(), 4000)
    }

    function renderForm() {
      const container = $('container')
      container.innerHTML = ''
      let currentSection = null

      for (const field of FIELDS) {
        if (field.section) {
          currentSection = document.createElement('div')
          currentSection.className = 'section'
          const title = document.createElement('div')
          title.className = 'section-title'
          title.textContent = field.section
          currentSection.appendChild(title)
          container.appendChild(currentSection)
          continue
        }

        const div = document.createElement('div')
        div.className = field.type === 'json' ? 'field field-json' : 'field'
        const label = document.createElement('label')
        label.textContent = field.label
        label.htmlFor = 'f_' + field.key
        div.appendChild(label)

        const currentValue = currentSettings[field.key] !== undefined ? currentSettings[field.key] : field.default

        if (field.type === 'checkbox') {
          const row = document.createElement('div')
          row.className = 'checkbox-row'
          const input = document.createElement('input')
          input.type = 'checkbox'
          input.id = 'f_' + field.key
          input.checked = !!currentValue
          row.appendChild(input)
          const span = document.createElement('span')
          span.textContent = currentValue ? '开启' : '关闭'
          span.style.fontSize = '13px'
          input.addEventListener('change', () => { span.textContent = input.checked ? '开启' : '关闭' })
          row.appendChild(span)
          div.appendChild(row)
        } else if (field.type === 'select') {
          const select = document.createElement('select')
          select.id = 'f_' + field.key
          for (const opt of field.options) {
            const option = document.createElement('option')
            option.value = opt
            option.textContent = opt
            if (String(currentValue) === String(opt)) option.selected = true
            select.appendChild(option)
          }
          div.appendChild(select)
        } else if (field.type === 'json') {
          const textarea = document.createElement('textarea')
          textarea.id = 'f_' + field.key
          textarea.value = typeof currentValue === 'string' ? currentValue : JSON.stringify(currentValue)
          div.appendChild(textarea)
        } else {
          const input = document.createElement('input')
          input.type = field.type === 'number' ? 'number' : 'text'
          input.id = 'f_' + field.key
          input.value = currentValue !== undefined && currentValue !== null ? currentValue : ''
          if (field.type === 'number') input.step = 'any'
          div.appendChild(input)
        }

        const help = document.createElement('div')
        help.className = 'help-text'
        help.textContent = field.help
        div.appendChild(help)

        if (currentSection) currentSection.appendChild(div)
      }
    }

    function collectSettings() {
      const settings = {}
      for (const field of FIELDS) {
        if (field.section) continue
        const el = $('f_' + field.key)
        if (!el) continue
        if (field.type === 'checkbox') {
          settings[field.key] = el.checked
        } else if (field.type === 'number') {
          settings[field.key] = el.value === '' ? field.default : Number(el.value)
        } else if (field.type === 'json') {
          try {
            settings[field.key] = JSON.parse(el.value)
          } catch (e) {
            showMessage(`"${field.label}" 的 JSON 格式不正确: ${e.message}`, 'error')
            return null
          }
        } else {
          settings[field.key] = el.value
        }
      }
      return settings
    }

    async function loadSettings() {
      try {
        const r = await fetch('/api/mindcraft-settings')
        const d = await r.json()
        if (d.success) {
          currentSettings = d.settings
          renderForm()
          $('btnSave').disabled = false
        } else {
          $('container').innerHTML = `<div class="loading">加载失败: ${d.message}</div>`
        }
      } catch (e) {
        $('container').innerHTML = `<div class="loading">加载失败: ${e.message}</div>`
      }
    }

    $('btnSave').addEventListener('click', async () => {
      const settings = collectSettings()
      if (!settings) return
      $('btnSave').disabled = true
      $('btnSave').textContent = '保存中...'
      try {
        const r = await fetch('/api/mindcraft-settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ settings })
        })
        const d = await r.json()
        if (d.success) {
          showMessage('✅ 已保存，MindCraft 正在重启...', 'success')
          setTimeout(() => {
            $('btnSave').disabled = false
            $('btnSave').textContent = '保存并重启 MindCraft'
          }, 3000)
        } else {
          showMessage('保存失败: ' + d.message, 'error')
          $('btnSave').disabled = false
          $('btnSave').textContent = '保存并重启 MindCraft'
        }
      } catch (e) {
        showMessage('保存失败: ' + e.message, 'error')
        $('btnSave').disabled = false
        $('btnSave').textContent = '保存并重启 MindCraft'
      }
    })

    loadSettings()
  </script>
</body>
</html>
