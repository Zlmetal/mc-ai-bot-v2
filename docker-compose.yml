services:
  mc-ai-bot:
    image: ghcr.io/zlmetal/mc-ai-bot-v2:main
    container_name: mc-ai-bot
    restart: unless-stopped
    ports:
      - "3800:3000"
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./data/agents:/app/mindcraft/agents
      - ./data/bots:/app/mindcraft/bots
    environment:
      - TZ=Asia/Shanghai
      - MC_HOST=你的MC服务器内网IP
      - MC_PORT=25565
      - MC_AUTH=offline
